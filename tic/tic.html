<!DOCTYPE html> 
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <title>Tic Tac Toe</title>
  <link rel="stylesheet" href="tic.css">
</head>
<body>
  <div class="container">
    <h1>❌⭕ Tic Tac Toe</h1>
    <div id="game" class="board"></div>
    <p id="winner"></p>
    <button onclick="resetGame()">Qayta boshlash</button>
  </div>
  <script>
    const game = document.getElementById("game");
    const winnerText = document.getElementById("winner");
    let currentPlayer = "X";
    let cells = Array(9).fill("");
    let gameOver = false;
  
    function renderBoard(highlight = []) {
      game.innerHTML = "";
      cells.forEach((val, i) => {
        const cell = document.createElement("div");
        cell.className = "cell";
  
        // G‘olib belgilarni ajratish
        if (highlight.includes(i)) {
          cell.classList.add(currentPlayer === "X" ? "win-x" : "win-o");
        }
  
        // Har bir X va O uchun rang qo‘llash
        if (val === "X") {
          cell.style.color = "#007BFF";
        } else if (val === "O") {
          cell.style.color = "#FF4D4D";
        }
  
        cell.textContent = val;
  
        // Faqat o‘yin davomida bosilsin
        if (!gameOver) {
          cell.onclick = () => makeMove(i);
        }
  
        game.appendChild(cell);
      });
  
      // Navbatga qarab orqa fon va belgilar rangi o‘zgaradi
      if (!gameOver) {
        if (currentPlayer === "X") {
          document.body.style.backgroundColor = "darkblue"; // light blue
        } else {
          document.body.style.backgroundColor = "darkred"; // light red
        }
      }
    }
  
    function makeMove(i) {
      if (cells[i] === "" && !gameOver) {
        cells[i] = currentPlayer;
        const winCombo = checkWin();
        if (winCombo) {
          gameOver = true;
          winnerText.textContent = `🎉 ${currentPlayer} g‘olib!`;
          renderBoard(winCombo);
        } else {
          currentPlayer = currentPlayer === "X" ? "O" : "X";
          renderBoard();
        }
      }
    }
  
    function checkWin() {
      const wins = [
        [0,1,2], [3,4,5], [6,7,8],
        [0,3,6], [1,4,7], [2,5,8],
        [0,4,8], [2,4,6]
      ];
      for (let [a,b,c] of wins) {
        if (cells[a] && cells[a] === cells[b] && cells[b] === cells[c]) {
          return [a,b,c];
        }
      }
      return null;
    }
  
    function resetGame() {
      cells = Array(9).fill("");
      currentPlayer = "X";
      winnerText.textContent = "";
      gameOver = false;
      document.body.style.backgroundColor = "#333";
      renderBoard();
    }
  
    document.body.style.backgroundColor = "#333"; // Boshlang‘ich fon
    renderBoard();
  </script>  
</body>
</html>
