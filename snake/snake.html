<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <title>Snake O‘yini</title>
  <link rel="stylesheet" href="snake.css">
</head>
<body>
  <h1>🐍 Snake O‘yini</h1>
  <canvas id="gameCanvas" width="400" height="400"></canvas>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
  
    const box = 20;
    let rows, cols;
    let score = 0;
    let direction;
    let snake = [];
    let food = {};
  
    function resizeCanvas() {
      canvas.width = Math.floor(window.innerWidth / box) * box;
      canvas.height = Math.floor((window.innerHeight - 80) / box) * box; // 80px for title
      rows = canvas.height / box;
      cols = canvas.width / box;
    }
  
    function initGame() {
      resizeCanvas();
      snake = [{ x: Math.floor(cols / 2) * box, y: Math.floor(rows / 2) * box }];
      score = 0;
      direction = null;
      placeFood();
    }
  
    function placeFood() {
      food = {
        x: Math.floor(Math.random() * cols) * box,
        y: Math.floor(Math.random() * rows) * box,
      };
    }
  
    document.addEventListener("keydown", e => {
      if (e.key === "ArrowLeft" && direction !== "RIGHT") direction = "LEFT";
      else if (e.key === "ArrowUp" && direction !== "DOWN") direction = "UP";
      else if (e.key === "ArrowRight" && direction !== "LEFT") direction = "RIGHT";
      else if (e.key === "ArrowDown" && direction !== "UP") direction = "DOWN";
    });
  
    function drawEyes(x, y, dir) {
      ctx.fillStyle = "#fff";
      let eyeSize = 4;
      if (dir === "RIGHT") {
        ctx.beginPath();
        ctx.arc(x + 12, y + 5, eyeSize, 0, 2 * Math.PI);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(x + 12, y + 15, eyeSize, 0, 2 * Math.PI);
        ctx.fill();
      } else if (dir === "LEFT") {
        ctx.beginPath();
        ctx.arc(x + 5, y + 5, eyeSize, 0, 2 * Math.PI);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(x + 5, y + 15, eyeSize, 0, 2 * Math.PI);
        ctx.fill();
      } else if (dir === "UP") {
        ctx.beginPath();
        ctx.arc(x + 5, y + 5, eyeSize, 0, 2 * Math.PI);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(x + 15, y + 5, eyeSize, 0, 2 * Math.PI);
        ctx.fill();
      } else if (dir === "DOWN") {
        ctx.beginPath();
        ctx.arc(x + 5, y + 15, eyeSize, 0, 2 * Math.PI);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(x + 15, y + 15, eyeSize, 0, 2 * Math.PI);
        ctx.fill();
      }
    }
  
    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
  
      ctx.fillStyle = "#fff";
      ctx.font = "20px Arial";
      ctx.fillText("Ball: " + score, 10, 25);
  
      for (let i = 0; i < snake.length; i++) {
        ctx.fillStyle = i === 0 ? "#4CAF50" : "#76c776";
        ctx.fillRect(snake[i].x, snake[i].y, box, box);
        if (i === 0) {
          drawEyes(snake[i].x, snake[i].y, direction);
        }
      }
  
      ctx.fillStyle = "red";
      ctx.fillRect(food.x, food.y, box, box);
  
      let headX = snake[0].x;
      let headY = snake[0].y;
  
      if (direction === "LEFT") headX -= box;
      if (direction === "UP") headY -= box;
      if (direction === "RIGHT") headX += box;
      if (direction === "DOWN") headY += box;
  
      if (headX === food.x && headY === food.y) {
        score++;
        placeFood();
      } else {
        snake.pop();
      }
  
      const newHead = { x: headX, y: headY };
  
      if (
        headX < 0 || headX >= canvas.width ||
        headY < 0 || headY >= canvas.height ||
        checkCollision(newHead, snake)
      ) {
        clearInterval(game);
        alert("O'yin tugadi! Ball: " + score);
        location.reload();
      }
  
      snake.unshift(newHead);
    }
  
    function checkCollision(head, array) {
      return array.some(segment => head.x === segment.x && head.y === segment.y);
    }
  
    window.addEventListener("resize", () => {
      clearInterval(game);
      initGame();
      game = setInterval(draw, 150);
    });
  
    initGame();
    let game = setInterval(draw, 150);
  </script>
  
</body>
</html>
